<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>molscene web</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #viewport {
        position: absolute;
        inset: 0;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.85);
        padding: 10px 12px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        max-width: 320px;
        font-size: 13px;
        line-height: 1.4;
      }
      #panel h1 {
        font-size: 15px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #panel h1 a {
        margin-left: auto;
        display: inline-flex;
        color: #333;
      }
      #panel h1 a:hover {
        color: #000;
      }
      #status {
        color: #555;
      }
      #panel code {
        background: #eee;
        padding: 0 3px;
        border-radius: 3px;
      }
      #upload {
        margin-top: 8px;
      }
      #upload label {
        display: inline-block;
        cursor: pointer;
        padding: 5px 10px;
        background: #1a1a1a;
        color: #fff;
        border-radius: 6px;
        font-size: 12px;
      }
      #upload label:hover {
        background: #000;
      }
      #upload input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>
        molscene web
        <a
          href="https://github.com/kohbanye/molscene"
          target="_blank"
          rel="noopener"
          title="github.com/kohbanye/molscene"
          aria-label="GitHub repository"
        >
          <svg
            height="18"
            width="18"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </h1>
      <div>
        The Rust core runs in your browser via WebAssembly — JavaScript builds
        the <code>Scene</code> and compiles the geometry.
      </div>
      <div id="upload">
        <label for="file">Upload PDB or SDF…</label>
        <input id="file" type="file" accept=".pdb,.ent,.sdf,.mol" />
      </div>
      <div id="status">loading…</div>
    </div>
    <div id="viewport"></div>

    <!-- The Three.js viewer IIFE (copied next to this page by web/build.sh).
         Exposes window.molscene.renderGeometry(element, spec). -->
    <script src="./viewer.js"></script>
    <!-- The demo driver: imports the wasm-pack ES module from ./pkg. -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
