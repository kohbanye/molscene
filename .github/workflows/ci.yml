name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-core:
    name: Rust core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p molscene-core -- -D warnings
      - run: cargo test --workspace

  viewer:
    name: Viewer (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python facade (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Build viewer bundle
        run: cd viewer && npm install && npm run build
      - name: Set up venv + build extension
        run: |
          uv venv --python 3.12
          uv pip install maturin pytest
          uv run maturin develop
      - name: Run tests
        run: uv run pytest -m "not network"
