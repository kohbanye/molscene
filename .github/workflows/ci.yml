name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo (checkout + build/test).
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (with the human-readable
# version in a trailing comment) per a repo-wide supply-chain policy. When
# bumping, resolve the new tag to its commit SHA and update both.
jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ruff lint (Python)
        uses: astral-sh/ruff-action@eaf0ecdd668ceea36159ff9d91882c9795d89b49 # v3.4.0
        with:
          args: "check"
      - name: Ruff format check (Python)
        uses: astral-sh/ruff-action@eaf0ecdd668ceea36159ff9d91882c9795d89b49 # v3.4.0
        with:
          args: "format --check"

  rust-core:
    name: Rust core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: WASM smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the WASM core + wgpu renderer (PDB/mmCIF/SDF parse path included)
        run: wasm-pack build crates/molscene-wasm --target web --out-dir pkg

  python:
    name: Python facade (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the WASM viewer bundle (force-included in the wheel)
        run: wasm-pack build crates/molscene-wasm --target no-modules --out-dir ../../python/molscene/_static/wasm
      - name: Set up venv + build extension
        run: |
          uv venv --python 3.12
          uv pip install maturin pytest
          uv run maturin develop
      - name: Verify type stubs are current (pyo3-stub-gen)
        # Regenerate python/molscene/_core/__init__.pyi from the live PyO3
        # signatures and fail if the committed stub has drifted. PYO3_PYTHON
        # points the (non-extension-module) stub_gen binary at the venv
        # interpreter so it links the same libpython as the wheel build.
        run: |
          PYO3_PYTHON="$(uv run python -c 'import sys; print(sys.executable)')" \
            cargo run -p molscene-py --features stub-gen --bin stub_gen
          git diff --exit-code python/molscene/_core
      - name: Run tests
        run: uv run pytest -m "not network"
