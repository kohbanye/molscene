name: Release

# Builds platform wheels (abi3 — one wheel per platform covers every supported
# CPython, see crates/molscene-py/Cargo.toml) plus an sdist with maturin, and
# publishes to PyPI on a version tag. A manual run (workflow_dispatch) builds
# and uploads the artifacts for inspection without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: build jobs only read the repo. The publish job reads a token
# from a protected environment (below); it needs no extra repo scope.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (version in a trailing
# comment) per the repo-wide supply-chain policy; see .github/workflows/ci.yml.
jobs:
  # The notebook viewer bundle is pure WebAssembly (platform-independent), so
  # build it once and share it with every wheel job via an artifact.
  wasm-bundle:
    name: WASM viewer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the bundle (molscene core + wgpu renderer, no-modules)
        run: wasm-pack build crates/molscene-wasm --target no-modules --out-dir ../../python/molscene/_static/wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-bundle
          path: |
            python/molscene/_static/wasm/molscene_wasm.js
            python/molscene/_static/wasm/molscene_wasm_bg.wasm

  build:
    name: Wheel (${{ matrix.platform.os }}/${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    needs: wasm-bundle
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, runner: ubuntu-latest, target: x86_64 }
          - { os: linux, runner: ubuntu-latest, target: aarch64 }
          - { os: macos, runner: macos-13, target: x86_64 }
          - { os: macos, runner: macos-14, target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch the prebuilt WASM viewer bundle (force-included in the wheel)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-bundle
          path: python/molscene/_static/wasm
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          # Ignored off Linux; on Linux builds against the manylinux toolchain.
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sdist]
    # Only an actual version tag publishes; a manual run just builds artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    # The PyPI token lives in this (maintainer-configured, protected)
    # environment; nothing else in the workflow can read it.
    environment: pypi
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match pyproject version $ver"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
