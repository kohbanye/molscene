name: Deploy web demo

# Publishes the pure-web WASM demo (web/) to GitHub Pages. Runs on pushes to
# main, and on demand (so the demo can be previewed from a feature branch via
# the Actions tab → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the Pages write/OIDC scopes are granted
# only to the deploy job below (it's the only one that publishes).
permissions:
  contents: read

# One concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build viewer bundle + WASM core into web/
        run: ./web/build.sh
      - name: Upload Pages artifact (the web/ directory)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs to publish to Pages and mint the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
