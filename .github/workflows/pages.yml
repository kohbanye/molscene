name: Deploy web demo

# Publishes the pure-web WASM demo (web/) to GitHub Pages. Runs on pushes to
# main, and on demand (so the demo can be previewed from a feature branch via
# the Actions tab → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the workflow level; the Pages write/OIDC scopes are granted
# only to the deploy job below (it's the only one that publishes).
permissions:
  contents: read

# One concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned to full commit SHAs (version in a trailing
# comment) per the repo-wide supply-chain policy; see .github/workflows/ci.yml.
jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the WASM core + wgpu renderer into web/
        run: ./web/build.sh
      - name: Upload Pages artifact (the web/ directory)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Only this job needs to publish to Pages and mint the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
