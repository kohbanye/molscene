[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "molscene"
version = "0.1.0"
description = "Notebook-native molecular visualization with a Rust core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "Koh Sakano" }]
keywords = ["molecular-visualization", "jupyter", "pymol", "3dmol", "structural-biology"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/kohbanye/molscene"

[tool.maturin]
# Mixed layout: pure-Python facade under python/, native module built from the
# PyO3 crate. The viewer bundle and .pyi stubs live inside python/molscene/ and
# are picked up automatically as package data.
python-source = "python"
manifest-path = "crates/molscene-py/Cargo.toml"
module-name = "molscene._core"
features = ["molscene-py/extension-module"]
# The viewer bundle is generated by esbuild and gitignored, so force-include it
# (maturin otherwise skips gitignored files under python-source).
include = [{ path = "python/molscene/_static/viewer.js", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the network (RCSB); skipped by default in CI"]
addopts = "-m 'not network'"
