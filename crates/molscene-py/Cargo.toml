[package]
name = "molscene-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for molscene-core (builds the molscene._core extension module)."

[lib]
name = "_core"
# `rlib` (alongside the `cdylib` extension module) lets the `stub_gen` binary
# link the crate to reach the stub-info gatherer.
crate-type = ["cdylib", "rlib"]
# No Rust tests here (logic lives in molscene-core). Disabling the test target
# keeps `cargo test --workspace` from building a binary that must link libpython
# without the `extension-module` feature.
test = false
doctest = false

[dependencies]
molscene-core = { workspace = true }
serde_json = { workspace = true }
# `abi3-py310` builds against the stable ABI (matching requires-python >=3.10),
# so a single wheel per platform covers all supported CPython versions.
pyo3 = { version = "0.28", features = ["abi3-py310"] }
# Drives the auto-generated type stubs (python/molscene/_core.pyi). The
# `#[gen_stub_*]` macros register signatures via `inventory`; the `stub_gen`
# binary below emits the .pyi.
pyo3-stub-gen = "0.22"

[features]
# Enabled by maturin for wheel builds; left off for `cargo test` so the crate
# does not require linking libpython during workspace builds.
extension-module = ["pyo3/extension-module"]
# Gates the `stub_gen` binary so plain `cargo test/clippy --workspace` (no
# Python toolchain assumed) never tries to build it.
stub-gen = []

# Regenerates python/molscene/_core.pyi from the live PyO3 signatures. Gated by
# `required-features` so it is skipped unless explicitly requested:
#   cargo run -p molscene-py --features stub-gen --bin stub_gen
[[bin]]
name = "stub_gen"
required-features = ["stub-gen"]
doc = false
