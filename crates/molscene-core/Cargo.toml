[package]
name = "molscene-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core engine for molscene: structure model, scene graph, selection, and JSON scene-spec serialization."
# Only the explicitly-declared [[bench]] targets below; keeps benches/common.rs
# a shared module (included via #[path]) rather than its own bench executable.
autobenches = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
pdbtbx = { version = "0.12", optional = true }
kiddo = { version = "5", default-features = false }
fast-surface-nets = "0.2"

[features]
default = ["parse"]
# `parse` pulls in pdbtbx (native only — excluded from WASM builds).
parse = ["dep:pdbtbx"]

[dev-dependencies]
insta = { version = "1", features = ["json"] }
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

# Benchmarks (run with `cargo bench -p molscene-core`; not part of CI).
[[bench]]
name = "bond_inference"
harness = false

[[bench]]
name = "geometry"
harness = false
