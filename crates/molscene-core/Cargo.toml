[package]
name = "molscene-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core engine for molscene: structure model, scene graph, selection, and JSON scene-spec serialization."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
pdbtbx = { version = "0.12", optional = true }

[features]
default = ["parse"]
# `parse` pulls in pdbtbx (native only — excluded from WASM builds).
parse = ["dep:pdbtbx"]

[dev-dependencies]
insta = { version = "1", features = ["json"] }
